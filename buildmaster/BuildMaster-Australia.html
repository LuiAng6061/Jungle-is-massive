<html lang="en">

  <title>BuildMaster Australia — WA Builder Training Simulator</title>

  <style>
:root {
  --bg: #0b1220; --panel: #121b2e; --panel2: #16223a; --line: #243352;
  --ink: #e6edf7; --muted: #93a4c0; --teal: #0f766e; --teal2: #14b8a6;
  --amber: #fbbf24; --red: #f87171; --green: #4ade80; --blue: #60a5fa;
  --radius: 12px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px; line-height: 1.5;
}
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
.sidebar h1 span { color: var(--amber); }
.sub { color: var(--muted); font-size: 12px; margin: 4px 0 20px; }
.nav { list-style: none; padding: 0; margin: 0 0 18px; }
.nav li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 14px; }
.nav li:hover { background: var(--panel2); color: var(--ink); }
.nav li.active { background: var(--teal); color: #fff; }
.nav .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .6; }
.mode-box label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
.mode-box select, .seedbox { width: 100%; margin-top: 6px; }
select { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
.seedbox { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--panel); }
.crumbs { font-weight: 600; }
.stats { display: flex; gap: 8px; }
.pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.pill b { color: var(--amber); }
.view { padding: 28px; flex: 1; max-width: 1000px; }

.disclaimer { padding: 14px 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; background: var(--panel); }

h2 { margin: 0 0 4px; font-size: 20px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; gap: 16px; }
.grid.cols3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.card .big { font-size: 26px; font-weight: 700; }
.muted { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.tag.warn { color: var(--amber); border-color: #5a4a17; background: #2a2410; }
.tag.ok { color: var(--green); }
.tag.bad { color: var(--red); }

.btn { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--teal2); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--panel2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mt { margin-top: 18px; } .mb { margin-bottom: 14px; }

.choice { display: block; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
.choice:hover { border-color: var(--teal2); }
.choice.selected { border-color: var(--teal2); background: #10261f; }
.choice.good { border-color: var(--green); }
.choice.bad { border-color: var(--red); }

.steps { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.step { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.step.on { background: var(--teal); color: #fff; border-color: var(--teal); }
.step.done { color: var(--green); border-color: #1f4d3a; }

.source-panel { background: #0e1830; border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 13px; }
.source-panel .k { color: var(--muted); }
.warnbox { background: #2a2410; border: 1px solid #5a4a17; color: var(--amber); border-radius: 8px; padding: 10px; font-size: 13px; }
.okbox { background: #10261f; border: 1px solid #1f4d3a; color: var(--green); border-radius: 8px; padding: 10px; font-size: 13px; }
.badbox { background: #2a1414; border: 1px solid #5a2020; color: var(--red); border-radius: 8px; padding: 10px; font-size: 13px; }

.mentor-fab { position: fixed; right: 20px; bottom: 20px; background: var(--teal); color: #fff; border: none; border-radius: 999px; padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 20; }
.mentor-fab:hover { background: var(--teal2); }
.mentor { position: fixed; right: 20px; bottom: 20px; width: 320px; background: var(--panel); border: 1px solid var(--teal); border-radius: 12px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 20; }
.mentor h4 { margin: 0 0 6px; font-size: 14px; } .mentor .body { font-size: 13px; color: var(--muted); max-height: 200px; overflow-y: auto; }
.mentor .close { float: right; cursor: pointer; color: var(--muted); }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 140px 1fr 40px; align-items: center; gap: 10px; font-size: 13px; }
.bar .track { background: var(--panel2); border-radius: 999px; height: 10px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--teal2)); }
textarea { width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 90px; font-family: inherit; }
a { color: var(--blue); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .grid.cols3, .grid.cols2 { grid-template-columns: 1fr; }
  .view { padding: 18px 16px; }
  .mentor { left: 16px; right: 16px; width: auto; }
  .mentor-fab { right: 16px; bottom: 16px; }
  .bar { grid-template-columns: 100px 1fr 34px; }
}

// BuildMaster Australia — REGULATORY KNOWLEDGE ENGINE
// The game engine NEVER hard-codes rules; it queries this module. Version/status-aware (§4, §38, §58).


function getSource(id) {
  return SOURCES[id] || null;
}

function getTopic(id) {
  return TOPICS.find((t) => t.id === id) || null;
}

// Determine the applicable regulatory context for a project (does NOT assume newest = applicable).
function regulatoryContext(project) {
  return {
    jurisdiction: project.jurisdiction,
    building_class: project.building_class,
    ncc_edition: project.ncc_edition, // taken from the project's approval context, not "latest"
  };
}

// Build the source-verification record shown in the VIEW SOURCE panel (§39).
function sourcePanel(topicId) {
  const t = getTopic(topicId);
  if (!t) return null;
  const s = getSource(t.source);
  const unreliable = t.status !== 'CURRENT';
  return {
    topic: t.topic,
    requirement_type: t.requirement_type,
    authority: s ? s.authority : '—',
    document: s ? s.document : '—',
    edition: t.ncc_edition || (s ? s.edition : ''),
    section: t.ncc_section || '',
    clause: t.clause || '(clause not yet verified)',
    source_url: s ? s.source_url : '',
    status: t.status,
    confidence: t.confidence,
    warning: unreliable
      ? 'UNVERIFIED — Do not rely on this information for real-world compliance. Verify against the ' +
        'applicable NCC edition, standard, legislation and project documents.'
      : '',
  };
}

// Statuses preserved, never overwritten (§58).

// BuildMaster Australia — GAME ENGINE (pure logic; testable; queries the regulatory engine)


// ---- Seeded RNG (mulberry32) so projects/events are replayable (§9) --------------------------
function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// ---- Difficulty modes (§27, §33) -------------------------------------------------------------
const MODES = {
  beginner: { id: 'beginner', label: 'Beginner', hintFloor: 0, freeText: false, guided: true },
  builder: { id: 'builder', label: 'Builder', hintFloor: 1, freeText: false, guided: false },
  expert: { id: 'expert', label: 'Expert', hintFloor: 3, freeText: true, guided: false },
};

// ---- Player profile --------------------------------------------------------------------------
function newProfile() {
  const skills = {};
  SKILL_AXES.forEach((a) => { skills[a.key] = 0; }); // 0..100 descriptive indicators, not certification
  const knowledge = {};
  TOPICS.forEach((t) => {
    knowledge[t.id] = { score: 0, seen: 0, correct: 0, incorrect: 0, reviewDue: 0 };
  });
  return {
    version: 1, xp: 0, level: 1, mode: 'beginner',
    skills, knowledge, completedScenarios: [], seed: 1,
  };
}

function levelFromXp(xp) {
  // 10 competency levels; XP alone does not advance past a soft cap without competency (§8).
  const idx = Math.min(LEVELS.length, Math.max(1, Math.floor(xp / 120) + 1));
  return idx;
}
function levelName(level) { return LEVELS[Math.min(level, LEVELS.length) - 1]; }

// Competency gate: to pass a level the player must have non-trivial skill in its core axes (§8).
function competencyGate(profile, requiredAxes, threshold = 40) {
  const failing = requiredAxes.filter((k) => (profile.skills[k] || 0) < threshold);
  return { passed: failing.length === 0, failing };
}

// ---- Scoring (multi-dimensional, §76) --------------------------------------------------------
const SCORE_DIMS = ['safety', 'compliance', 'quality', 'documentation', 'risk'];

function scoreScenario(scenario, run) {
  // run = { evidenceChosen:[ids], ruleCorrect:bool, decisionId, mode }
  const chosenIds = new Set(run.evidenceChosen || []);
  const goodEvidence = scenario.evidence.filter((e) => e.good);
  const goodPicked = goodEvidence.filter((e) => chosenIds.has(e.id)).length;
  const badPicked = scenario.evidence.filter((e) => !e.good && chosenIds.has(e.id)).length;
  const evidenceScore = clamp(goodPicked - badPicked, 0, goodEvidence.length) / Math.max(1, goodEvidence.length);

  const decision = scenario.decisions.find((d) => d.id === run.decisionId) || { scores: {}, outcomeGood: false };
  const decisionTotal = SCORE_DIMS.reduce((s, k) => s + (decision.scores[k] || 0), 0);

  const dims = {
    evidence: Math.round(evidenceScore * 100),
    source: run.ruleCorrect ? 100 : 30,
    decision: Math.round(clamp((decisionTotal + 6) / 12, 0, 1) * 100),
  };
  const overall = Math.round((dims.evidence + dims.source + dims.decision) / 3);
  const xp = Math.round(overall * 0.6) + (decision.outcomeGood ? 20 : 0);
  return { dims, overall, xp, decision, evidenceScore };
}

// ---- Consequence engine (probabilistic, remembers decisions, §20, §77) -----------------------
function resolveConsequence(scenario, result, rng) {
  // Even a good decision can occasionally surface a latent issue; a bad decision usually bites.
  const goodPath = result.decision.outcomeGood;
  const roll = rng();
  const triggeredBad = goodPath ? roll < 0.1 : roll < 0.85;
  return {
    text: triggeredBad ? scenario.consequences.bad : scenario.consequences.good,
    good: !triggeredBad,
  };
}

// ---- Spaced repetition (§10) -----------------------------------------------------------------
function updateKnowledge(profile, topicId, correct, now = Date.now()) {
  const k = profile.knowledge[topicId] || (profile.knowledge[topicId] = { score: 0, seen: 0, correct: 0, incorrect: 0, reviewDue: 0 });
  k.seen += 1;
  if (correct) { k.correct += 1; k.score = clamp(k.score + 15, 0, 100); }
  else { k.incorrect += 1; k.score = clamp(k.score - 10, 0, 100); }
  // Errors bring the topic back sooner; consistent success spaces it out but never removes it.
  const intervalDays = correct ? Math.min(30, 1 + k.correct * 3) : 1;
  k.reviewDue = now + intervalDays * 86400000;
  return k;
}
function dueForReview(profile, now = Date.now()) {
  return Object.entries(profile.knowledge)
    .filter(([, k]) => k.seen > 0 && k.reviewDue <= now)
    .map(([id]) => id);
}

// ---- Apply a scenario result to the profile --------------------------------------------------
function applyResult(profile, scenario, result, correctForKnowledge) {
  profile.xp += result.xp;
  profile.level = levelFromXp(profile.xp);
  (scenario.skillsTested || []).forEach((axis) => {
    const delta = Math.round((result.overall - 40) / 6); // -ve if poor, +ve if strong
    profile.skills[axis] = clamp((profile.skills[axis] || 0) + delta, 0, 100);
  });
  updateKnowledge(profile, scenario.topic, correctForKnowledge);
  if (!profile.completedScenarios.includes(scenario.id)) profile.completedScenarios.push(scenario.id);
  return profile;
}

// ---- Seeded random event selection (§9, §19) -------------------------------------------------
function pickEvent(profile, stage, seed) {
  const rng = makeRng(hashSeed(`${seed}:${stage}:${profile.completedScenarios.length}`));
  const pool = EVENTS.filter((e) => e.stage === stage);
  const list = pool.length ? pool : EVENTS;
  return list[Math.floor(rng() * list.length)];
}

// ---- Free-text evaluation (expert mode, §26) — structural, not keyword-only ------------------
function evaluateFreeText(text, rubric) {
  const t = (text || '').toLowerCase();
  const hits = rubric.filter((r) => r.any.some((kw) => t.includes(kw)));
  const covered = hits.map((h) => h.label);
  const missed = rubric.filter((r) => !hits.includes(r)).map((h) => h.label);
  const score = Math.round((covered.length / rubric.length) * 100);
  return { score, covered, missed };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ---- Persistence (localStorage, guarded) -----------------------------------------------------
const KEY = 'buildmaster.profile.v1';
function loadProfile() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (_) { /* private mode / blocked */ }
  return newProfile();
}
function saveProfile(profile) {
  try { localStorage.setItem(KEY, JSON.stringify(profile)); } catch (_) { /* ignore */ }
}
function migrate(p) {
  const base = newProfile();
  return { ...base, ...p, skills: { ...base.skills, ...(p.skills || {}) }, knowledge: { ...base.knowledge, ...(p.knowledge || {}) } };
}

  const r = E.evaluateFreeText(text, rubric);
  return `<div class="card mb"><h3>Free-text evaluation (structure, not keywords) — ${r.score}/100</h3>
    <p class="muted">Covered: ${r.covered.map(esc).join(', ') || '—'}</p>
    <p class="muted">Consider also: ${r.missed.map(esc).join(', ') || '—'}</p></div>`;
}

// ---------- Find the Rule (embedded + standalone, §17) ----------
function renderFindRule(body, scn, done) {
  const path = scn.rulePath;
  const steps = [
    { key: 'jurisdiction', label: 'Jurisdiction', opts: ['WA', 'NSW', 'VIC'] },
    { key: 'edition', label: 'Applicable NCC edition', opts: ['NCC 2022', 'NCC 2019', 'NCC 2016'] },
    { key: 'area', label: 'Relevant area', opts: [path.area, 'Fire safety', 'Energy efficiency'].filter(uniq) },
    { key: 'pathway', label: 'Compliance pathway', opts: [path.pathway, 'Performance Solution', 'Unsure'].filter(uniq) },
  ];
  const c = el(`<div>
    <p class="lead">Navigate to the authoritative source — reward is correct source + applicability, not clause memorisation.</p>
    <div id="frsteps"></div>
    <button class="btn mt" id="checkrule" disabled>Confirm source ▶</button>
    <div id="rulefeedback" class="mt"></div>
  </div>`);
  body.appendChild(c);
  const box = $('#frsteps', c);
  steps.forEach((s) => {
    const wrap = el(`<div class="card mb"><h3>${esc(s.label)}</h3><div class="row" data-key="${s.key}"></div></div>`);
    const rowBox = $('.row', wrap);
    shuffleStable(s.opts).forEach((o) => {
      const b = el(`<button class="choice" style="width:auto;display:inline-block;margin:0 8px 0 0">${esc(o)}</button>`);
      b.onclick = () => { run.ruleSel[s.key] = o; rowBox.querySelectorAll('.choice').forEach((x) => x.classList.remove('selected')); b.classList.add('selected'); refresh(); };
      if (run.ruleSel[s.key] === o) b.classList.add('selected');
      rowBox.appendChild(b);
    });
    box.appendChild(wrap);
  });
  const check = $('#checkrule', c);
  function refresh() { check.disabled = steps.some((s) => !run.ruleSel[s.key]); }
  refresh();
  check.onclick = () => {
    const correct = run.ruleSel.jurisdiction === path.jurisdiction && run.ruleSel.edition === path.edition &&
      run.ruleSel.area === path.area && run.ruleSel.pathway === path.pathway;
    run.ruleCorrect = correct;
    const sp = R.sourcePanel(scn.topic);
    $('#rulefeedback', c).innerHTML = `<div class="${correct ? 'okbox' : 'warnbox'} mb">${correct
      ? 'Correct navigation. Authoritative source identified below.'
      : 'Not the expected path. Compare with the applicable project context, then review the source.'}</div>${sourcePanelHtml(sp)}
      <button class="btn mt" id="fr-next">Continue to decision ▶</button>`;
    $('#fr-next', c).onclick = done;
  };
}
function renderFindRuleStandalone(v) {
  const scn = SCENARIOS[0];
  if (!run || run.scn !== scn) startScenario(scn);
  run.step = 'findrule';
  v.appendChild(el(`<div><h2>Find the Rule — practice</h2></div>`));
  renderFindRule(v, scn, () => { alert('Nice — in a full scenario this leads to the decision step.'); });
}

function sourcePanelHtml(sp) {
  if (!sp) return '';
  return `<div class="source-panel mb">
    <div class="row" style="justify-content:space-between"><b>VIEW SOURCE — ${esc(sp.topic)}</b>
      <span class="tag ${sp.status === 'CURRENT' ? 'ok' : 'warn'}">${esc(sp.status)} · ${esc(sp.confidence)}</span></div>
    <div><span class="k">Type:</span> ${esc(sp.requirement_type)}</div>
    <div><span class="k">Authority:</span> ${esc(sp.authority)}</div>
    <div><span class="k">Document:</span> ${esc(sp.document)} ${esc(sp.edition)}</div>
    <div><span class="k">Section:</span> ${esc(sp.section || '—')} · <span class="k">Clause:</span> ${esc(sp.clause)}</div>
    <div><span class="k">Source:</span> <a href="${esc(sp.source_url)}" target="_blank" rel="noopener">${esc(sp.source_url)}</a></div>
    ${sp.warning ? `<div class="warnbox mt">${esc(sp.warning)}</div>` : ''}
  </div>`;
}

// ---------- knowledge review (§10) ----------
function renderReview(v) {
  const dueIds = E.dueForReview(profile);
  v.appendChild(el(`<div>
    <h2>Knowledge review — spaced repetition</h2>
    <p class="lead">Repeated errors resurface sooner; consistent success spaces topics out but never removes them.</p>
    <div class="grid cols2">
      ${TOPICS.map((t) => {
        const k = profile.knowledge[t.id] || { score: 0, seen: 0 };
        const due = dueIds.includes(t.id);
        return `<div class="card"><h3>${esc(t.topic)} ${due ? '<span class="tag warn">due</span>' : ''}</h3>
          <div class="muted mb">${esc(t.category)} · ${esc(t.skill)} · status ${esc(t.status)} (${esc(t.confidence)})</div>
          <div class="bar"><span class="muted">retention</span><div class="track"><div class="fill" style="width:${k.score}%"></div></div><span>${k.score}</span></div>
          <div class="muted mt" style="font-size:12px">seen ${k.seen || 0}×</div></div>`;
      }).join('')}
    </div>
  </div>`));
}

// ---------- player profile (§11) ----------
function renderProfile(v) {
  const gate = E.competencyGate(profile, ['waterproofing', 'structural', 'ncc'], 40);
  v.appendChild(el(`<div>
    <h2>Player profile — ${esc(E.levelName(profile.level))}</h2>
    <p class="lead">Descriptive learning indicators only — not a licence, registration or competency certification.</p>
    <div class="card mb"><h3>Skill profile</h3><div class="bars">
      ${SKILL_AXES.map((a) => `<div class="bar"><span>${esc(a.label)}</span><div class="track"><div class="fill" style="width:${profile.skills[a.key] || 0}%"></div></div><span>${profile.skills[a.key] || 0}</span></div>`).join('')}
    </div></div>
    <div class="card mb"><h3>Competency gate → next tier (waterproofing, structural, NCC ≥ 40)</h3>
      ${gate.passed ? '<div class="okbox">Gate met — progression not blocked by this gate.</div>'
        : `<div class="warnbox">Not yet: strengthen ${gate.failing.join(', ')}. XP alone does not advance you.</div>`}
    </div>
    <div class="card"><h3>Personal learning observations</h3>${learningObservations()}</div>
  </div>`));
}
function learningObservations() {
  const s = profile.skills; const obs = [];
  if (s.structural > s.waterproofing + 15) obs.push('Strong structural reasoning but comparatively light on waterproofing evidence.');
  if (s.contracts < 20 && profile.completedScenarios.length > 0) obs.push('Tends to under-document decisions — documentation score lags.');
  if (s.safety >= 40) obs.push('Consistently identifies safety scope before acting.');
  if (!obs.length) obs.push('Not enough data yet — play a few scenarios to generate observations.');
  return '<ul class="muted">' + obs.map((o) => `<li>${esc(o)}</li>`).join('') + '</ul>';
}

// ---------- competency assessment (§35) ----------
function renderAssessment(v) {
  v.appendChild(el(`<div>
    <h2>Level competency assessment</h2>
    <p class="lead">Scenario-based, multi-dimensional. Passing does NOT confer a licence, registration or statutory qualification.</p>
    <div class="card mb"><h3>Readiness snapshot</h3>
      <div class="muted">Scenarios completed: ${profile.completedScenarios.length}/${SCENARIOS.length} · XP ${profile.xp} · Level ${profile.level}</div>
      <div class="bars mt">
        ${['waterproofing', 'structural', 'ncc', 'safety', 'contracts'].map((k) => {
          const a = SKILL_AXES.find((x) => x.key === k);
          return `<div class="bar"><span>${esc(a.label)}</span><div class="track"><div class="fill" style="width:${profile.skills[k] || 0}%"></div></div><span>${profile.skills[k] || 0}</span></div>`;
        }).join('')}
      </div>
    </div>
    <div class="${profile.completedScenarios.length >= SCENARIOS.length ? 'okbox' : 'warnbox'}">
      ${profile.completedScenarios.length >= SCENARIOS.length
        ? 'All available slice scenarios complete. In the full product this unlocks a scored scenario assessment.'
        : 'Complete the available scenarios to attempt the assessment.'}
    </div>
  </div>`));
}

// ---------- mentor with progressive hint ladder (§27) ----------
// The mentor lives in its own persistent wrapper on <body>, so re-rendering the
// scenario view (e.g. toggling evidence) never rebuilds or re-opens it.
let mentorOpen = false;
function mountMentor() {
  if (!run || currentPage !== 'play') { document.querySelector('.mentor-wrap')?.remove(); return; }
  if (document.querySelector('.mentor-wrap')) return; // already mounted; leave it alone
  const wrap = el('<div class="mentor-wrap"></div>');
  document.body.appendChild(wrap);
  drawMentor(wrap);
}
function drawMentor(wrap) {
  wrap.innerHTML = '';
  if (!mentorOpen) {
    const fab = el('<button class="mentor-fab">🪵 Mentor</button>');
    fab.onclick = () => { mentorOpen = true; drawMentor(wrap); };
    wrap.appendChild(fab);
    return;
  }
  const m = el(`<div class="mentor"><span class="close" id="mc">✕</span><h4>🪵 Builder Mentor <span class="tag">${esc(E.MODES[profile.mode].label)}</span></h4>
    <div class="body" id="mbody"></div>
    <button class="btn ghost mt" id="hint" style="width:100%">Ask for a hint</button></div>`);
  wrap.appendChild(m);
  $('#mc', m).onclick = () => { mentorOpen = false; drawMentor(wrap); };
  renderHint($('#mbody', m));
  $('#hint', m).onclick = () => { run.hintLevel = Math.min(6, run.hintLevel + 1); renderHint($('#mbody', m)); };
}
function renderHint(box) {
  const scn = run.scn; const t = R.getTopic(scn.topic); const sp = R.sourcePanel(scn.topic);
  const floor = E.MODES[profile.mode].hintFloor;
  const lvl = Math.max(run.hintLevel, run.hintLevel === 0 ? 0 : floor);
  const ladder = [
    'The mentor challenges you: experience or "it\'ll be fine" is not evidence. What would you need to prove it?',
    `Think about the risk category: ${esc(t.category)}. What could go wrong if this is concealed?`,
    `Technical clue: ${esc(t.common_mistake)}`,
    `Relevant document: check "${esc(scn.evidence.find((e) => e.doc)?.doc || 'the project detail')}".`,
    `Relevant source: ${esc(sp.authority)} — ${esc(sp.document)}. Verify the current provision yourself.`,
    `Model reasoning: ${esc(t.explanation)}`,
  ];
  const shown = ladder.slice(0, Math.max(1, lvl));
  box.innerHTML = shown.map((h, i) => `<p><b>${['Hint 1', 'Hint 2', 'Technical clue', 'Document', 'Source', 'Model reasoning'][i]}:</b> ${h}</p>`).join('')
    + (lvl >= 6 ? '' : '<p class="muted">The mentor won\'t just hand over the answer — keep investigating.</p>');
}

// ---------- utils ----------
function uniq(v, i, a) { return a.indexOf(v) === i; }
function shuffleStable(arr) { return arr.slice().sort((a, b) => (E.hashSeed(a + seed) - E.hashSeed(b + seed))); }

boot();

  </script>
